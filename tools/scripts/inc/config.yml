current_package_ids:
  gtfs: timetable-2026-gtfs2020
  hrdf: timetable-54-2026-hrdf

csv_latest_data:  
  # https://data.opentransportdata.swiss/en/dataset/business-organisation-v2
  business-organisation-v2:
