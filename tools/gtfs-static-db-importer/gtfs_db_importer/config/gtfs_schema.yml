# https://opentransportdata.swiss/de/cookbook/timetable-cookbook/gtfs/
tables:
  # One row describing the source feed and import timing; filter bounds are in feed_info.
  metadata_import:
    columns:
      - id INTEGER PRIMARY KEY CHECK (id = 1) # fixed ID for the single import record
      - source_folder TEXT NOT NULL # original GTFS input folder
      - source_feed_start_date TEXT # original feed_info date, YYYYMMDD; NULL if missing
      - source_feed_end_date TEXT # original feed_info date, YYYYMMDD; NULL if missing
      - import_start TEXT NOT NULL # timestamp when the import started, ISO 8601 with timezone
      - import_end TEXT # timestamp when the import finished; NULL until completion

  # One row per source GTFS table, describing its original size and final DB row count.
  metadata_tables:
    columns:
      - table_name TEXT PRIMARY KEY NOT NULL # GTFS table name without .txt
      - source_file_present INTEGER NOT NULL CHECK (source_file_present IN (0, 1))
      - source_rows INTEGER NOT NULL CHECK (source_rows >= 0) # excludes the CSV header
      - retained_rows INTEGER NOT NULL CHECK (retained_rows >= 0) # final DB count, including generated rows

  agency:
    columns:
      - agency_id TEXT PRIMARY KEY
      - agency_name TEXT NOT NULL
      - agency_url TEXT
      - agency_timezone TEXT
      - agency_lang TEXT
      - agency_phone TEXT

  calendar:
    columns:
      - service_id TEXT PRIMARY KEY
      - monday INTEGER
      - tuesday INTEGER
      - wednesday INTEGER
      - thursday INTEGER
      - friday INTEGER
      - saturday INTEGER
      - sunday INTEGER
      - start_date TEXT NOT NULL
      - end_date TEXT NOT NULL
      - day_bits TEXT # similar with HRDF

  # This is imported just to keep the GTFS reference
  # For the service_id availability we use day_bits in calendar
  calendar_dates:
    columns:
      - service_id TEXT NOT NULL
      - date TEXT NOT NULL
      - exception_type INTEGER NOT NULL
    indexes:
      - service_id
      - date
      - exception_type
    keys:
      - PRIMARY KEY (service_id, date)
      - FOREIGN KEY (service_id) REFERENCES calendar(service_id)

  feed_info:
    columns:
      - feed_publisher_name TEXT NOT NULL
      - feed_publisher_url TEXT
      - feed_lang TEXT
      - feed_start_date TEXT
      - feed_end_date TEXT
      - feed_version TEXT NOT NULL

  frequencies:
    columns:
      - trip_id TEXT PRIMARY KEY
      - start_time TEXT NOT NULL
      - end_time TEXT NOT NULL
      - headway_secs INTEGER NOT NULL
      - exact_times INTEGER NOT NULL
    indexes:
      - trip_id
      - headway_secs
      - exact_times
    keys:
      - FOREIGN KEY (trip_id) REFERENCES trips(trip_id)

  link_agency:
    columns:
      - agency_id TEXT PRIMARY KEY NOT NULL
      - has_gtfs_rt INTEGER NOT NULL
      - day_bits TEXT NOT NULL CHECK (LENGTH(TRIM(day_bits)) > 0) # similar with HRDF
    indexes:
      - has_gtfs_rt

  routes:
    columns:
      - route_id TEXT PRIMARY KEY
      - agency_id TEXT NOT NULL
      - route_short_name TEXT NOT NULL 
      - route_long_name TEXT
      - route_desc TEXT
      - route_type INTEGER NOT NULL # extended codes, check https://opentransportdata.swiss/de/cookbook/timetable-cookbook/gtfs/
      - day_bits TEXT # similar with HRDF
      - representative_trip_id TEXT # the trip that occurs the most
    indexes:
      - agency_id
      - route_short_name
      - route_type
      - representative_trip_id
    keys:
      - FOREIGN KEY (agency_id) REFERENCES agency(agency_id)

  shapes:
    columns:
      - shape_id INTEGER
      - shape_pt_lat REAL NOT NULL
      - shape_pt_lon REAL NOT NULL
      - shape_pt_sequence INTEGER
      - shape_dist_traveled REAL
    indexes:
      - shape_id
      - shape_pt_sequence

  stop_times:
    columns:
      - trip_id TEXT
      - arrival_time TEXT
      - departure_time TEXT
      - stop_id TEXT NOT NULL
      - stop_sequence INTEGER NOT NULL
      - pickup_type INTEGER
      - drop_off_type INTEGER
    indexes:
      - trip_id
      - stop_id
      - stop_sequence
      - pickup_type
      - drop_off_type
    keys:
      - FOREIGN KEY (trip_id) REFERENCES trips(trip_id)
      - FOREIGN KEY (stop_id) REFERENCES stops(stop_id)

  stations:
    columns:
      - station_id TEXT PRIMARY KEY
      - day_bits TEXT # similar with HRDF

  stops:
    columns:
      - stop_id TEXT PRIMARY KEY
      - stop_name TEXT NOT NULL
      - stop_lon REAL NOT NULL
      - stop_lat REAL NOT NULL
      - definition: location_type INTEGER NOT NULL
        value_if_blank: 0
      - definition: parent_station TEXT CHECK (parent_station IS NULL OR LENGTH(TRIM(parent_station)) > 0)
        value_if_blank: null
      - platform_code TEXT
      - original_stop_id TEXT
    indexes:
      - location_type
      - parent_station
      - platform_code
      - original_stop_id

  transfers:
    columns:
      - from_stop_id TEXT NOT NULL
      - to_stop_id TEXT NOT NULL
      - from_route_id TEXT
      - to_route_id TEXT
      - from_trip_id TEXT
      - to_trip_id TEXT
      - transfer_type INTEGER NOT NULL
      - min_transfer_time INTEGER
      - service_id TEXT
    indexes:
      - from_stop_id
      - to_stop_id
      - from_route_id
      - to_route_id
      - from_trip_id
      - to_trip_id
      - transfer_type
      - service_id
    keys:
      - FOREIGN KEY (from_stop_id) REFERENCES stops(stop_id)
      - FOREIGN KEY (to_stop_id) REFERENCES stops(stop_id)

  trips:
    columns:
      - trip_id TEXT PRIMARY KEY
      - route_id TEXT NOT NULL
      - service_id TEXT NOT NULL
      - trip_headsign TEXT
      - trip_short_name TEXT
      - direction_id TEXT
      - block_id INTEGER
      # custom below
      - definition: departure_day_minutes INTEGER NOT NULL
        value_if_blank: -1
      - definition: arrival_day_minutes INTEGER NOT NULL
        value_if_blank: -1
      - departure_time TEXT
      - arrival_time TEXT
      - stop_times_s TEXT # added to avoid GROUP_BY queries
      - stop_times_count INTEGER # added to avoid GROUP_BY queries
      - shape_id TEXT
      - original_trip_id TEXT # https://opentransportdata.swiss/en/cookbook/gtfs/#tripstxt
      - hints TEXT
    indexes:
      - route_id
      - service_id
      - direction_id
      - block_id
      - departure_day_minutes
      - arrival_day_minutes
      - trip_short_name
      - original_trip_id
      - stop_times_count
    keys:
      - FOREIGN KEY (route_id) REFERENCES routes(route_id)
      - FOREIGN KEY (service_id) REFERENCES calendar(service_id)
      - FOREIGN KEY (shape_id) REFERENCES shapes(shape_id)
