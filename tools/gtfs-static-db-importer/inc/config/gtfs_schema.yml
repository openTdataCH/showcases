# https://opentransportdata.swiss/de/cookbook/timetable-cookbook/gtfs/
tables:
  agency:
    columns:
      - agency_id TEXT PRIMARY KEY
      - agency_name TEXT NOT NULL
      - agency_url TEXT
      - agency_timezone TEXT
      - agency_lang TEXT
      - agency_phone TEXT
      - day_bits TEXT # similar with HRDF

  calendar:
    columns:
      - service_id TEXT PRIMARY KEY
      - monday INTEGER
      - tuesday INTEGER
      - wednesday INTEGER
      - thursday INTEGER
      - friday INTEGER
      - saturday INTEGER
      - sunday INTEGER
      - start_date TEXT NOT NULL
      - end_date TEXT NOT NULL
      - day_bits TEXT # similar with HRDF

  # This is imported just to keep the GTFS reference
  # For the service_id availability we use day_bits in calendar
  calendar_dates:
    columns:
      - service_id TEXT NOT NULL
      - date TEXT NOT NULL
      - exception_type INTEGER NOT NULL
    indexes:
      - service_id
      - date
      - exception_type
    keys:
      - PRIMARY KEY (service_id, date)
      - FOREIGN KEY (service_id) REFERENCES calendar(service_id)

  feed_info:
    columns:
      - feed_publisher_name TEXT NOT NULL
      - feed_publisher_url TEXT
      - feed_lang TEXT
      - feed_start_date TEXT NOT NULL
      - feed_end_date TEXT NOT NULL
      - feed_version TEXT NOT NULL

  frequencies:
    columns:
      - trip_id TEXT PRIMARY KEY
      - start_time TEXT NOT NULL
      - end_time TEXT NOT NULL
      - headway_secs INTEGER NOT NULL
      - exact_times INTEGER NOT NULL
    indexes:
      - trip_id
      - headway_secs
      - exact_times
    keys:
      - FOREIGN KEY (trip_id) REFERENCES trips(trip_id)

  link_agency:
    columns:
      - agency_id TEXT PRIMARY KEY
      - has_gtfs_rt INTEGER
    indexes:
      - has_gtfs_rt

  routes:
    columns:
      - route_id TEXT PRIMARY KEY
      - agency_id TEXT NOT NULL
      - route_short_name TEXT NOT NULL 
      - route_long_name TEXT
      - route_desc TEXT
      - route_type INTEGER NOT NULL # extended codes, check https://opentransportdata.swiss/de/cookbook/timetable-cookbook/gtfs/
      - day_bits TEXT # similar with HRDF
      - representative_trip_id TEXT # the trip that occurs the most
    indexes:
      - agency_id
      - route_short_name
      - route_type
      - representative_trip_id
    keys:
      - FOREIGN KEY (agency_id) REFERENCES agency(agency_id)

  shapes:
    columns:
      - shape_id INTEGER
      - shape_pt_lat REAL NOT NULL
      - shape_pt_lon REAL NOT NULL
      - shape_pt_sequence INTEGER
      - shape_dist_traveled REAL
    indexes:
      - shape_id
      - shape_pt_sequence

  stop_times:
    columns:
      - trip_id TEXT
      - arrival_time TEXT
      - departure_time TEXT
      - stop_id TEXT NOT NULL
      - stop_sequence INTEGER NOT NULL
      - pickup_type INTEGER
      - drop_off_type INTEGER
    indexes:
      - trip_id
      - stop_id
      - stop_sequence
      - pickup_type
      - drop_off_type
    keys:
      - FOREIGN KEY (trip_id) REFERENCES trips(trip_id)
      - FOREIGN KEY (stop_id) REFERENCES stops(stop_id)

  stops:
    columns:
      - stop_id TEXT PRIMARY KEY
      - stop_name TEXT NOT NULL
      - stop_lon REAL NOT NULL
      - stop_lat REAL NOT NULL
      - location_type TEXT
      - parent_station TEXT
      - platform_code TEXT
      - original_stop_id TEXT
    indexes:
      - location_type
      - parent_station
      - platform_code
      - original_stop_id

  transfers:
    columns:
      - from_stop_id TEXT NOT NULL
      - to_stop_id TEXT NOT NULL
      - from_route_id TEXT
      - to_route_id TEXT
      - from_trip_id TEXT
      - to_trip_id TEXT
      - transfer_type INTEGER NOT NULL
      - min_transfer_time INTEGER
    indexes:
      - from_stop_id
      - to_stop_id
      - from_route_id
      - to_route_id
      - from_trip_id
      - to_trip_id
      - transfer_type
    keys:
      - FOREIGN KEY (from_stop_id) REFERENCES stops(stop_id)
      - FOREIGN KEY (to_stop_id) REFERENCES stops(stop_id)

  trips:
    columns:
      - trip_id TEXT PRIMARY KEY
      - route_id TEXT NOT NULL
      - service_id TEXT NOT NULL
      - trip_headsign TEXT
      - trip_short_name TEXT
      - direction_id TEXT
      - block_id INTEGER
      # custom below
      - departure_day_minutes INTEGER
      - arrival_day_minutes INTEGER
      - departure_time TEXT
      - arrival_time TEXT
      - stop_times_s TEXT # added to avoid GROUP_BY queries
      - stop_times_count INTEGER # added to avoid GROUP_BY queries
      - shape_id TEXT
      - original_trip_id TEXT # https://opentransportdata.swiss/en/cookbook/gtfs/#tripstxt
      - hints TEXT
    indexes:
      - route_id
      - service_id
      - direction_id
      - block_id
      - departure_day_minutes
      - arrival_day_minutes
      - trip_short_name
      - original_trip_id
      - stop_times_count
    keys:
      - FOREIGN KEY (route_id) REFERENCES routes(route_id)
      - FOREIGN KEY (service_id) REFERENCES calendar(service_id)
      - FOREIGN KEY (shape_id) REFERENCES shapes(shape_id)
